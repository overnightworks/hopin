sonar.organization=overnightworks
sonar.projectKey=overnightworks_hopin
# `sonar.sources` is an allowlist, so code this repository runs but does not
# name here is code no rule can fire on, in either direction, while the
# project still reports zero findings. Naming the package alone left the
# workflow unanalysed and the scan log said so -- "There are no files to be
# analyzed for the GitHub Actions language" (06.09.2026) -- and it left
# `scripts/` out the same way, including the gate that keeps this
# repository's own root layout rule.
#
# `.github` is named whole rather than the workflows beneath it, as
# overnightworks/marketplace names it: everything under it runs with this
# repository's credentials, so a composite action added later is analysed
# without another change here. It carries nothing but `workflows/ci.yml`
# today, so the wider spelling drags nothing else in.
#
# Every analysed Python file is also measured for coverage, so the hundred
# percent floor holds over `scripts/` too (the "Test with coverage" step in
# .github/workflows/ci.yml).
sonar.sources=src/hopin,scripts,.github
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# The zero-findings gate ("SonarCloud open findings" step in
# .github/workflows/ci.yml) queries the analysis right after this scan posts
# it; without waiting, that query can race a still-processing report and read
# stale (or absent) results.
sonar.qualitygate.wait=true
