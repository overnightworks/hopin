sonar.organization=overnightworks
sonar.projectKey=overnightworks_hopin
# The workflow runs with this repository's credentials on every push, so it
# is code the scanner must see. `sonar.sources` is an allowlist, and naming
# the package alone left the workflow unanalysed: the scan log printed
# "There are no files to be analyzed for the GitHub Actions language"
# (06.09.2026), so no rule could fire on it in either direction and this
# project's zero findings quietly excluded it.
sonar.sources=src/hopin,.github/workflows
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# The zero-findings gate ("SonarCloud open findings" step in
# .github/workflows/ci.yml) queries the analysis right after this scan posts
# it; without waiting, that query can race a still-processing report and read
# stale (or absent) results.
sonar.qualitygate.wait=true
