sonar.organization=overnightworks
sonar.projectKey=overnightworks_hopin
# `sonar.sources` is an allowlist, so code this repository runs but does not
# name here is code no rule can fire on, in either direction, while the
# project still reports zero findings. Naming the package alone left the
# workflow unanalysed and the scan log said so -- "There are no files to be
# analyzed for the GitHub Actions language" (06.09.2026).
#
# `.github` is named whole rather than the workflows beneath it, as
# overnightworks/marketplace names it: everything under it runs with this
# repository's credentials, so a composite action added later is analysed
# without another change here. It carries nothing but `workflows/ci.yml`
# today, so the wider spelling drags nothing else in.
#
# `Dockerfile` is named for the same reason: the image is code this repository
# runs, and without it Sonar's Docker rules (root user, pinning) never fire.
#
# Which files are measured for coverage is pyproject.toml's to say, under
# [tool.coverage.run].
sonar.sources=src/hopin,frontend/src,.github,Dockerfile
# frontend/src/app.html is the template every route renders into, not a page.
# Each route owns its title through <svelte:head>, and a <title> here would be
# each page's first and override the sign-in pages' kit title. The end-to-end
# suite owns the titles: test_page_shell.py and test_sign_in_pages.py pin each
# page's title and the single <title> of a built page. The gate refuses
# sonar.issue.ignore keys, and prettier moves a NOSONAR comment off the <head>
# line the HTML analyzer reports.
sonar.exclusions=**/node_modules/**,**/.svelte-kit/**,frontend/coverage/**,src/hopin/web/build/**,frontend/src/app.html
sonar.tests=tests,frontend
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/merged-lcov.info
# Browser code is covered by Vitest for the TypeScript it reports and by the
# end-to-end suite for the rest; scripts/merge_frontend_coverage.py merges both.
# SonarCloud does not index .svelte files, so their records stay unresolved.
# why: generated from the Python wire owners by scripts/generate_wire.py, not maintained source.
sonar.cpd.exclusions=frontend/src/lib/**/wire.ts
