sonar.organization=overnightworks
sonar.projectKey=overnightworks_hopin
# `sonar.sources` is an allowlist, so code this repository runs but does not
# name here is code no rule can fire on, in either direction, while the
# project still reports zero findings. Naming the package alone left the
# workflow unanalysed and the scan log said so -- "There are no files to be
# analyzed for the GitHub Actions language" (06.09.2026).
#
# `.github` is named whole rather than the workflows beneath it, as
# overnightworks/marketplace names it: everything under it runs with this
# repository's credentials, so a composite action added later is analysed
# without another change here. It carries nothing but `workflows/ci.yml`
# today, so the wider spelling drags nothing else in.
#
# `Dockerfile` is named for the same reason: the image is code this repository
# runs, and without it Sonar's Docker rules (root user, pinning) never fire.
#
# Which files are measured for coverage is pyproject.toml's to say, under
# [tool.coverage.run].
sonar.sources=src/hopin,.github,Dockerfile
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# Browser code is not Python and the Python coverage report cannot measure it.
# Its proof is the end-to-end suite (#45), not a coverage figure.
sonar.coverage.exclusions=src/hopin/web/static/**
