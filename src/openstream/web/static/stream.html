<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStream - Start Streaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            padding: 2rem;
        }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #fff; }
        video {
            width: 100%;
            max-height: 70vh;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: #6366f1; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-secondary { background: #374151; color: #fff; }
        .share-box {
            background: #1a1a2e;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: none;
        }
        .share-box.visible { display: block; }
        .share-url {
            width: 100%;
            padding: 0.5rem;
            background: #0f0f1a;
            border: 1px solid #4b5563;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: monospace;
            margin-top: 0.5rem;
        }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .status-connected { background: #064e3b; color: #6ee7b7; }
        .status-disconnected { background: #451a03; color: #fbbf24; }
        .status-error { background: #450a0a; color: #fca5a5; }
        .viewer-count {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenStream</h1>
        <div id="status" class="status status-disconnected">Not streaming</div>
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="controls">
            <button id="startBtn" class="btn-primary">Start Streaming</button>
            <button id="stopBtn" class="btn-danger" disabled>Stop</button>
            <button id="screenBtn" class="btn-secondary">Share Screen</button>
        </div>
        <div id="shareBox" class="share-box">
            <strong>Share this link with friends:</strong>
            <input id="shareUrl" class="share-url" readonly>
            <button id="copyBtn" class="btn-secondary" style="margin-top: 0.5rem;">Copy Link</button>
        </div>
        <div id="viewerCount" class="viewer-count"></div>
    </div>

    <script>
        const SIGNAL_TYPE = {
            OFFER: "offer",
            ANSWER: "answer",
            ICE_CANDIDATE: "ice_candidate",
            JOIN: "join",
            ROOM_CREATED: "room_created",
            VIEWER_JOINED: "viewer_joined",
            VIEWER_LEFT: "viewer_left",
            ERROR: "error",
        };

        const ROLE = { STREAMER: "streamer" };
        const RTC_CONFIG = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        const localVideo = document.getElementById("localVideo");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const screenBtn = document.getElementById("screenBtn");
        const shareBox = document.getElementById("shareBox");
        const shareUrl = document.getElementById("shareUrl");
        const copyBtn = document.getElementById("copyBtn");
        const statusEl = document.getElementById("status");
        const viewerCountEl = document.getElementById("viewerCount");

        let ws = null;
        let localStream = null;
        let connectionId = null;
        let roomId = null;
        let peerConnections = {};
        let viewerCount = 0;

        function generateId() {
            return crypto.randomUUID();
        }

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = "status status-" + type;
        }

        function updateViewerCount() {
            viewerCountEl.textContent = viewerCount > 0
                ? viewerCount + " viewer" + (viewerCount !== 1 ? "s" : "") + " watching"
                : "";
        }

        async function startStreaming(useScreen) {
            try {
                if (useScreen) {
                    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                } else {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                }
                localVideo.srcObject = localStream;
                connectSignaling();
                startBtn.disabled = true;
                screenBtn.disabled = true;
                stopBtn.disabled = false;
            } catch (err) {
                setStatus("Failed to access media: " + err.message, "error");
            }
        }

        function connectSignaling() {
            connectionId = generateId();
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = protocol + "//" + location.host + "/ws?id=" + connectionId;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                setStatus("Connected - creating room...", "connected");
                ws.send(JSON.stringify({ type: SIGNAL_TYPE.JOIN, role: ROLE.STREAMER }));
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleSignal(data);
            };

            ws.onclose = function() {
                setStatus("Disconnected", "disconnected");
            };

            ws.onerror = function() {
                setStatus("Connection error", "error");
            };
        }

        function handleSignal(data) {
            switch (data.type) {
                case SIGNAL_TYPE.ROOM_CREATED:
                    roomId = data.room_id;
                    const viewUrl = location.origin + "/watch/" + roomId;
                    shareUrl.value = viewUrl;
                    shareBox.classList.add("visible");
                    setStatus("Live! Room: " + roomId, "connected");
                    break;

                case SIGNAL_TYPE.VIEWER_JOINED:
                    createPeerConnection(data.viewer_id);
                    break;

                case SIGNAL_TYPE.ANSWER:
                    handleAnswer(data);
                    break;

                case SIGNAL_TYPE.ICE_CANDIDATE:
                    handleIceCandidate(data);
                    break;

                case SIGNAL_TYPE.VIEWER_LEFT:
                    removePeerConnection(data.viewer_id);
                    break;

                case SIGNAL_TYPE.ERROR:
                    setStatus("Error: " + data.message, "error");
                    break;
            }
        }

        async function createPeerConnection(viewerId) {
            const pc = new RTCPeerConnection(RTC_CONFIG);
            peerConnections[viewerId] = pc;
            viewerCount++;
            updateViewerCount();

            localStream.getTracks().forEach(function(track) {
                pc.addTrack(track, localStream);
            });

            pc.onicecandidate = function(event) {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: SIGNAL_TYPE.ICE_CANDIDATE,
                        target: viewerId,
                        candidate: event.candidate,
                    }));
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({
                type: SIGNAL_TYPE.OFFER,
                target: viewerId,
                sdp: pc.localDescription,
            }));
        }

        async function handleAnswer(data) {
            const pc = peerConnections[data.from];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            }
        }

        async function handleIceCandidate(data) {
            const pc = peerConnections[data.from];
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        }

        function removePeerConnection(viewerId) {
            const pc = peerConnections[viewerId];
            if (pc) {
                pc.close();
                delete peerConnections[viewerId];
                viewerCount--;
                updateViewerCount();
            }
        }

        function stopStreaming() {
            if (localStream) {
                localStream.getTracks().forEach(function(track) { track.stop(); });
                localStream = null;
            }
            Object.values(peerConnections).forEach(function(pc) { pc.close(); });
            peerConnections = {};
            if (ws) { ws.close(); ws = null; }
            localVideo.srcObject = null;
            shareBox.classList.remove("visible");
            viewerCount = 0;
            updateViewerCount();
            startBtn.disabled = false;
            screenBtn.disabled = false;
            stopBtn.disabled = true;
            setStatus("Not streaming", "disconnected");
        }

        startBtn.addEventListener("click", function() { startStreaming(false); });
        screenBtn.addEventListener("click", function() { startStreaming(true); });
        stopBtn.addEventListener("click", stopStreaming);
        copyBtn.addEventListener("click", function() {
            shareUrl.select();
            navigator.clipboard.writeText(shareUrl.value);
            copyBtn.textContent = "Copied!";
            setTimeout(function() { copyBtn.textContent = "Copy Link"; }, 2000);
        });
    </script>
</body>
</html>
