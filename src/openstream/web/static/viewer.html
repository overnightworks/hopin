<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStream - Watching</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            padding: 2rem;
        }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #fff; }
        video {
            width: 100%;
            max-height: 80vh;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .status-connected { background: #064e3b; color: #6ee7b7; }
        .status-connecting { background: #1e1b4b; color: #a5b4fc; }
        .status-disconnected { background: #451a03; color: #fbbf24; }
        .status-error { background: #450a0a; color: #fca5a5; }
        .ended-message {
            text-align: center;
            padding: 3rem;
            display: none;
        }
        .ended-message.visible { display: block; }
        .ended-message h2 { color: #fbbf24; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenStream</h1>
        <div id="status" class="status status-connecting">Connecting to stream...</div>
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="endedMessage" class="ended-message">
            <h2>Stream ended</h2>
            <p>The streamer has disconnected.</p>
        </div>
    </div>

    <script>
        const SIGNAL_TYPE = {
            OFFER: "offer",
            ANSWER: "answer",
            ICE_CANDIDATE: "ice_candidate",
            JOIN: "join",
            STREAMER_DISCONNECTED: "streamer_disconnected",
            ERROR: "error",
        };

        const ROLE = { VIEWER: "viewer" };
        const RTC_CONFIG = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        const remoteVideo = document.getElementById("remoteVideo");
        const statusEl = document.getElementById("status");
        const endedMessage = document.getElementById("endedMessage");

        let ws = null;
        let pc = null;
        let connectionId = null;

        function getRoomId() {
            const parts = location.pathname.split("/");
            return parts[parts.length - 1];
        }

        function generateId() {
            return crypto.randomUUID();
        }

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = "status status-" + type;
        }

        function connect() {
            const roomId = getRoomId();
            connectionId = generateId();
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = protocol + "//" + location.host + "/ws?id=" + connectionId;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                setStatus("Joining room...", "connecting");
                ws.send(JSON.stringify({
                    type: SIGNAL_TYPE.JOIN,
                    role: ROLE.VIEWER,
                    room_id: roomId,
                }));
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleSignal(data);
            };

            ws.onclose = function() {
                setStatus("Disconnected", "disconnected");
            };

            ws.onerror = function() {
                setStatus("Connection error", "error");
            };
        }

        function handleSignal(data) {
            switch (data.type) {
                case SIGNAL_TYPE.OFFER:
                    handleOffer(data);
                    break;

                case SIGNAL_TYPE.ICE_CANDIDATE:
                    handleIceCandidate(data);
                    break;

                case SIGNAL_TYPE.STREAMER_DISCONNECTED:
                    handleStreamEnded();
                    break;

                case SIGNAL_TYPE.ERROR:
                    setStatus("Error: " + data.message, "error");
                    break;
            }
        }

        async function handleOffer(data) {
            pc = new RTCPeerConnection(RTC_CONFIG);

            pc.ontrack = function(event) {
                remoteVideo.srcObject = event.streams[0];
                setStatus("Watching live stream", "connected");
            };

            pc.onicecandidate = function(event) {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: SIGNAL_TYPE.ICE_CANDIDATE,
                        target: data.from,
                        candidate: event.candidate,
                    }));
                }
            };

            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
                type: SIGNAL_TYPE.ANSWER,
                sdp: pc.localDescription,
            }));
        }

        async function handleIceCandidate(data) {
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        }

        function handleStreamEnded() {
            setStatus("Stream ended", "disconnected");
            endedMessage.classList.add("visible");
            if (pc) { pc.close(); pc = null; }
            if (ws) { ws.close(); ws = null; }
            remoteVideo.srcObject = null;
        }

        connect();
    </script>
</body>
</html>
