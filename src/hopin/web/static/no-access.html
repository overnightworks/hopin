<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopIn - No access</title>
    <link rel="stylesheet" href="/static/css/ui-console.css">
    <link rel="stylesheet" href="/static/css/hopin.css">
</head>
<body>
    <main class="sign-in">
        <div class="login">
            <div class="login-card">
                <div class="wordmark">Hop<span>In</span></div>
                <h1>No access</h1>
                <div class="banner banner--fail">
                    <span class="glyph"></span>
                    <div class="banner-body"><p>You are signed in, but this account has no access to HopIn.</p></div>
                </div>
                <form class="actions" method="post" action="/logout">
                    <button type="submit" class="btn btn--primary">Log out</button>
                </form>
            </div>
            <div class="legal-links">
                <a class="linkish" href="https://hallucinai.de/impressum" target="_blank" rel="noopener">Impressum</a>
                <a class="linkish" href="https://hallucinai.de/datenschutz#hopin" target="_blank" rel="noopener">Datenschutz</a>
            </div>
        </div>
    </main>
</body>
</html>
