<title>HopIn Agent hören</title>
<style>/* appkit family tokens and fonts: what every overnightworks product shares.
   With no theme choice the page follows the device (light, or dark under
   prefers-color-scheme); data-theme='light' and data-theme='dark' force a
   theme, and each theme sets color-scheme. The state set (--ok, --busy, --fail
   and their -soft partners) is shared; the app colour (--primary, --accent,
   --on-accent) and everything domain-specific stay with the app; the
   sign-in grid value is computed by the SignInPage component. Only the latin
   and latin-ext subsets, woff2 only. The classes as-typed and legal are the
   only rules outside the tokens and fonts; legal is the legal row of
   LegalLinks and of a page that cannot render Svelte. */

















:root {
	--bg: #f4f4f6;
	--bg-deep: #e8e8ec;
	--surface: #ffffff;
	--surface-hover: #ebebed;
	--border: #d0d0d4;
	--text: #1a1a1e;
	--text-muted: #555;
	--card-bg: rgba(255, 255, 255, 0.9);
	--header-bg: #f0f0f2;
	--ok: #1e7a1e;
	--ok-soft: #e0f5e0;
	--busy: #9a6200;
	--busy-soft: #fef3e0;
	--fail: #c02020;
	--fail-soft: #fde8e8;
	color-scheme: light;
	--font-display: 'Oswald', Impact, sans-serif;
	--font-body: 'Open Sans', Arial, sans-serif;
}

:root[data-theme='dark'] {
	--bg: #0d0d0d;
	--bg-deep: #050508;
	--surface: #111;
	--surface-hover: #1a1a1a;
	--border: #333;
	--text: #e0e0e0;
	--text-muted: #888;
	--card-bg: rgba(13, 13, 13, 0.85);
	--header-bg: #0a0a0a;
	--ok: #44aa44;
	--ok-soft: #1a3a1a;
	--busy: #f0a030;
	--busy-soft: #2a1f10;
	--fail: #ff4444;
	--fail-soft: #3a1a1a;
	color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
	:root:not([data-theme='light']) {
		--bg: #0d0d0d;
		--bg-deep: #050508;
		--surface: #111;
		--surface-hover: #1a1a1a;
		--border: #333;
		--text: #e0e0e0;
		--text-muted: #888;
		--card-bg: rgba(13, 13, 13, 0.85);
		--header-bg: #0a0a0a;
		--ok: #44aa44;
		--ok-soft: #1a3a1a;
		--busy: #f0a030;
		--busy-soft: #2a1f10;
		--fail: #ff4444;
		--fail-soft: #3a1a1a;
		color-scheme: dark;
	}
}

.as-typed {
	text-transform: none;
	letter-spacing: normal;
}

.legal {
	position: relative;
	z-index: 1;
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: 4px 16px;
	font-size: 12px;
}
.legal a {
	color: var(--text-muted);
	text-decoration: none;
	border-bottom: 1px solid var(--border);
}
.legal a:hover {
	color: var(--text);
	border-bottom-color: currentColor;
}
.legal.menu {
	justify-content: flex-start;
	gap: 2px 12px;
	padding: 8px 14px 6px;
	border-top: 1px solid var(--border);
	font-size: 11.5px;
}
.legal.menu a {
	display: inline-flex;
	align-items: center;
	min-height: 24px;
	border-bottom: none;
}

/* HopIn's own tokens: the slot colour, stage, shadow, motion and mono.
   appkit owns the neutrals, the states and color-scheme; the shell's fonts come from the kit (--font-body); `.sign-in` is the scroll container of the sign-in pages. */
:root {
    --mono: ui-monospace, "SFMono-Regular", "Consolas", monospace;
    --motion-snap: .28s;
    --motion-fade: .2s;
    --motion-quick: .15s;
    --motion-press: .1s;
    --motion-ring: 1.8s;
    --motion-wave: .9s;
    --motion-think: 1.1s;
    --accent: #1d5bbf;
    --primary: var(--accent);
    --accent-hover: #174a9c;
    --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
    --on-accent: #ffffff;
    --shadow-lg: 0 2px 6px rgba(20, 24, 29, .06), 0 28px 64px -28px rgba(20, 24, 29, .42);
    --shadow-sm: 0 1px 2px rgba(20, 24, 29, .06), 0 2px 8px -4px rgba(20, 24, 29, .14);
    --scrim: rgba(14, 18, 22, .36);
    --toast-bg: #1C2128;
    --toast-ink: #F4F6F8;
    --toast-act: #7aa7f0;
    /* The video stage is dark in both themes; these never change. */
    --stage: #0D1013;
    --stage-2: #171B20;
    --stage-3: #252B32;
    --on-stage: #F4F6F8;
    --on-stage-soft: rgba(244, 246, 248, .72);
    --glass: rgba(255, 255, 255, .15);
    --glass-hover: rgba(255, 255, 255, .24);
    --glass-dark: rgba(12, 14, 17, .55);
    --vignette: rgba(6, 8, 10, .42);
    --busy-stage: #EDB656;
    --accent-stage: #7aa7f0;
    --stage-fade: rgba(13, 16, 19, .92);
    --leave: #E5484D;
    --leave-hover: #CF3A3F;
    --on-leave: #FFFFFF;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --accent: #7aa7f0;
        --accent-hover: #a3c2f5;
        --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--surface));
        --on-accent: #111111;
        --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4), 0 28px 64px -28px rgba(0, 0, 0, .9);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 8px -4px rgba(0, 0, 0, .6);
    --scrim: rgba(0, 0, 0, .55);
        --toast-bg: #E8ECF0;
        --toast-ink: #14181D;
        --toast-act: #1d5bbf;
    }
}

:root[data-theme="dark"] {
    --accent: #7aa7f0;
    --accent-hover: #a3c2f5;
    --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--surface));
    --on-accent: #111111;
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4), 0 28px 64px -28px rgba(0, 0, 0, .9);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 8px -4px rgba(0, 0, 0, .6);
    --scrim: rgba(0, 0, 0, .55);
    --toast-bg: #E8ECF0;
    --toast-ink: #14181D;
    --toast-act: #1d5bbf;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
.sign-in { flex: 1; overflow: auto; }
body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
}
button, input, textarea { font-family: inherit; }
.kit-root { display: contents; }
#svelte-announcer {
    position: absolute;
    left: 0;
    top: 0;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    overflow: hidden;
    white-space: nowrap;
    width: 1px;
    height: 1px;
}
.connection-quality {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 5;
    height: 24px;
    padding: 0 8px 7px;
    border-radius: 999px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    background: var(--glass-dark);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.quality-bar {
    width: 3px;
    border-radius: 1px;
    background: var(--on-stage);
    opacity: .3;
}
.quality-bar:nth-child(1) { height: 4px; }
.quality-bar:nth-child(2) { height: 7px; }
.quality-bar:nth-child(3) { height: 10px; }
.connection-quality[data-quality="good"] .quality-bar { opacity: 1; }
.connection-quality[data-quality="fair"] .quality-bar:nth-child(-n+2),
.connection-quality[data-quality="poor"] .quality-bar:nth-child(1) {
    opacity: 1;
    background: var(--busy-stage);
}
/* Old-surface shape until the chat (20) and leave dialog (21) rows
   delete their selectors; the last one removes this rule. */
.btn-primary, .btn-danger, .btn-secondary, .chat-close {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 50px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    transition: opacity var(--motion-fade), background var(--motion-fade);
    display: flex;
    align-items: center;
    gap: 0.4rem;
}
.btn-primary:hover, .btn-danger:hover, .btn-secondary:hover, .chat-close:hover { opacity: 0.85; }
.btn-primary { background: #4f46e5; color: #fff; }
.btn-danger { background: #dc2626; color: #fff; }
.btn-secondary { background: #374151; color: #fff; }
.status {
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-size: 0.8rem;
}
.status-connected { background: #064e3b; color: #6ee7b7; }
.status-connecting { background: #1e1b4b; color: #a5b4fc; }
.status-disconnected { background: #451a03; color: #fbbf24; }
.status-error { background: #450a0a; color: #fca5a5; }
.confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
}
.confirm-box {
    color: #e0e0e0;
    background: #1a1a2e;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 1.5rem 2rem;
    text-align: center;
}
.confirm-box p {
    margin-bottom: 1rem;
    font-size: 1rem;
}
.confirm-box .btn-row {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
}
.chat-panel {
    width: 320px;
    display: none;
    flex-direction: column;
    border-left: 1px solid #1f1f1f;
    background: #111;
}
.chat-panel.visible { display: flex; }
.chat-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #1f1f1f;
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.chat-close {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0;
}
.chat-close:hover { color: #fff; }
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}
.chat-element { display: contents; }
.chat-msg {
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    font-size: 0.85rem;
    max-width: 90%;
    word-wrap: break-word;
}
.chat-msg.self {
    background: #4f46e5;
    align-self: flex-end;
}
.chat-msg.other {
    background: #1e293b;
    align-self: flex-start;
}
.chat-msg .chat-sender {
    font-size: 0.7rem;
    color: #9ca3af;
    margin-bottom: 0.15rem;
}
.chat-input-row {
    display: flex;
    padding: 0.5rem;
    gap: 0.4rem;
    border-top: 1px solid #1f1f1f;
}
.chat-input-row input {
    flex: 1;
    padding: 0.5rem;
    background: #0f0f1a;
    border: 1px solid #4b5563;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 0.85rem;
}
.chat-input-row button {
    padding: 0.5rem 1rem;
    border-radius: 6px;
}
@media (max-width: 600px) {
    .btn-primary, .btn-danger, .btn-secondary {
        padding: 0.5rem 0.8rem;
        font-size: 0.8rem;
    }
    .chat-panel { width: 100%; position: absolute; inset: 0; z-index: 50; }
}

.call {
    flex: 1;
    min-height: 0;
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: minmax(0, 1fr);
    background: var(--stage);
    color: var(--on-stage);
    font-family: var(--font-body);
}
.stage {
    --stage-bottom: 112px;
    --c: 1;
    --r: 1;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--stage);
}
.ctop {
    position: absolute;
    top: 4px;
    left: 16px;
    right: 16px;
    z-index: 30;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}
.ctop .left { display: flex; gap: 8px; }
.tag-glass {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border-radius: 999px;
    background: var(--glass-dark);
    color: var(--on-stage);
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}
.num { font-variant-numeric: tabular-nums; }
.grid { position: absolute; inset: 44px 8px var(--stage-bottom) 8px; }
.tiles {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(var(--c), 1fr);
    grid-template-rows: repeat(var(--r), 1fr);
    gap: 6px;
}
.stage[data-count="3"] { --c: 1; --r: 3; }
.stage[data-count="4"] { --c: 2; --r: 2; }
.stage[data-count="5"], .stage[data-count="6"] { --c: 2; --r: 3; }
.stage[data-count="7"], .stage[data-count="8"] { --c: 2; --r: 4; }
.stage[data-count="9"] { --c: 2; --r: 5; }
.tile {
    position: relative;
    min-height: 0;
    overflow: hidden;
    border-radius: 18px;
    background: var(--stage-2);
    container-type: size;
}
.tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile.mirror video { transform: scaleX(-1); }
.tile::after, .preview::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(to top, var(--vignette), transparent 42%);
}
.vid { position: absolute; inset: 0; overflow: hidden; z-index: 2; }
.vid.off { background: var(--stage-3); }
.av {
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(150deg, var(--c1, var(--accent)), var(--c2, var(--accent-hover)));
    color: var(--on-accent);
    font-weight: 650;
    letter-spacing: .01em;
}
.av svg { width: 56%; height: 56%; }
.vid.off .av {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(44px, 30cqmin, 112px);
    height: clamp(44px, 30cqmin, 112px);
}
.tile .name {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 5;
    max-width: calc(100% - 20px);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: var(--glass-dark);
    color: var(--on-stage);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.name .muted:not(.hidden) { display: inline-flex; color: var(--on-stage); opacity: .9; }
.name .wave:not(.hidden) { display: inline-flex; gap: 2px; align-items: center; height: 12px; color: var(--accent-stage); }
.wave i {
    width: 2.5px;
    height: 12px;
    border-radius: 2px;
    background: currentColor;
    transform: scaleY(.4);
    animation: wave var(--motion-wave) ease-in-out infinite;
}
.wave i:nth-child(2) { animation-delay: -.3s; }
.wave i:nth-child(3) { animation-delay: -.55s; }
@keyframes wave { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(.95); } }
.tile.speaking::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    z-index: 6;
    pointer-events: none;
    box-shadow: inset 0 0 0 3px var(--accent-stage);
    animation: speak var(--motion-ring) ease-in-out infinite;
}
.tile.agent .ai-badge { border: 1.5px solid var(--accent-stage); border-radius: 999px; padding: 0 5px; font-size: .6rem; line-height: 13px; font-weight: 750; letter-spacing: .04em; }
.tile.agent .sponsor { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500; opacity: .8; }
.tile.agent .sponsor::before { content: "\00b7\00a0"; }
.agent-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 7;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--glass-dark);
    color: var(--on-stage);
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.agent-remove:hover, .agent-remove:focus-visible { background: var(--glass); }
.tile.agent .av { color: var(--accent-stage); background: var(--stage-2); box-shadow: inset 0 0 0 2px var(--accent-stage); }
.agent-activity { position: absolute; left: 50%; top: calc(50% + clamp(22px, 15cqmin, 56px) + 14px); display: flex; gap: 5px; transform: translateX(-50%); }
.agent-activity i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-stage); }
.tile.agent.activity-thinking .agent-activity i { background: var(--busy-stage); animation: speak var(--motion-think) ease-in-out infinite; }
.tile.agent.activity-thinking .agent-activity i:nth-child(2) { animation-delay: -.3s; }
.tile.agent.activity-thinking .agent-activity i:nth-child(3) { animation-delay: -.6s; }
.tile.agent.activity-waiting .agent-activity i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent-stage); }
.tile.agent.activity-speaking .agent-activity { display: none; }
@keyframes speak { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (max-width: 600px) {
    .stage[data-count="1"] .grid, .stage[data-count="2"] .grid { inset: 0; }
    .stage[data-count="1"] .tile, .stage[data-count="2"] .tile:not(.self) {
        position: absolute;
        inset: 0;
        border-radius: 0;
    }
    .stage[data-count="1"] .tile .name, .stage[data-count="2"] .tile:not(.self) .name {
        left: 16px;
        bottom: calc(var(--stage-bottom) + 12px);
        height: 32px;
        padding: 0 12px;
        font-size: 14.5px;
    }
    .stage[data-count="2"] .tile.self {
        position: absolute;
        width: 104px;
        height: 152px;
        right: auto;
        bottom: auto;
        left: calc(100% - 118px);
        top: calc(100% - var(--stage-bottom) - 158px);
        z-index: 35;
        box-shadow: 0 10px 30px -10px var(--vignette), 0 0 0 1px var(--glass);
        touch-action: none;
        cursor: grab;
        transition:
            left var(--motion-snap) cubic-bezier(.2, .8, .2, 1),
            top var(--motion-snap) cubic-bezier(.2, .8, .2, 1),
            translate var(--motion-snap) cubic-bezier(.2, .8, .2, 1);
    }
    .stage[data-count="2"] .tile.self[data-corner="tl"] { left: 14px; top: 48px; }
    .stage[data-count="2"] .tile.self[data-corner="tr"] { left: calc(100% - 118px); top: 48px; }
    .stage[data-count="2"] .tile.self[data-corner="bl"] { left: 14px; top: calc(100% - var(--stage-bottom) - 158px); }
    .stage[data-count="2"] .tile.self.dragging { transition: none; cursor: grabbing; }
    .stage[data-count="2"] .tile.self .name, .stage[data-count="2"] .tile.self .connection-quality { display: none; }
    .stage[data-count="2"] .tile:not(.self) .connection-quality { top: 50px; right: 16px; }
    .stage[data-count="2"] .tile:not(.self).speaking::before { display: none; }
}
@media (min-width: 601px) {
    .chat-panel { grid-column: 2; grid-row: 1; }
    .stage { --stage-bottom: 92px; }
    .stage[data-count="2"] { --c: 2; --r: 1; }
    .stage[data-count="3"] { --c: 3; --r: 1; }
    .stage[data-count="5"], .stage[data-count="6"] { --c: 3; --r: 2; }
    .stage[data-count="7"], .stage[data-count="8"], .stage[data-count="9"] { --c: 3; --r: 3; }
    .ctop { top: 16px; left: 20px; right: 20px; }
    .grid {
        inset: 62px 20px var(--stage-bottom) 20px;
        container-type: size;
        display: grid;
        place-items: center;
    }
    .tiles {
        position: static;
        display: grid;
        grid-template-rows: none;
        gap: 10px;
        width: min(100cqw, calc((100cqh - (var(--r) - 1) * 10px) * 16 / 9 * var(--c) / var(--r)));
    }
    .tile { border-radius: 16px; aspect-ratio: 16 / 9; }
    .stage[data-count="1"] .grid { inset: 0; }
    .stage[data-count="1"] .tile {
        position: absolute;
        inset: 0;
        aspect-ratio: auto;
        border-radius: 0;
    }
    .stage[data-count="1"] .tile .name {
        left: 16px;
        bottom: calc(var(--stage-bottom) + 32px);
        height: 32px;
        padding: 0 12px;
        font-size: 14.5px;
    }
}

@media (prefers-reduced-motion: reduce) {
    :root {
        --motion-snap: 0s;
        --motion-fade: 0s;
        --motion-quick: 0s;
        --motion-press: 0s;
        --motion-ring: 0s;
        --motion-wave: 0s;
        --motion-think: 0s;
    }
}

.icon { display: block; flex: none; }
.button {
    display: inline-flex;
    align-items: center;
    border: 0;
    cursor: pointer;
    height: 52px;
    padding: 0 24px;
    border-radius: 999px;
