[project]
name = "hopin"
version = "0.1.0"
description = "Self-hosted video call service using WebRTC"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.123.7",
    "overnightworks-agents[backend,mcp-client,mcp-server,redis] @ git+https://github.com/overnightworks/agents@v0.78.0",
    "overnightworks-logline @ git+https://github.com/overnightworks/logline@v1.12.0",
    "overnightworks-speech-client @ git+https://github.com/overnightworks/speech@v0.27.0#subdirectory=packages/client",
    "overnightworks-tandem @ git+https://github.com/overnightworks/tandem@v0.17.0",
    "overnightworks-video-client @ git+https://github.com/overnightworks/video@v0.4.0#subdirectory=packages/client",
    "overnightworks-webauth[postgres] @ git+https://github.com/overnightworks/webauth@v0.46.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.0,<9",
    "sqlalchemy>=2.1.6",
    "structlog>=24.4",
    "urllib3>=2.6.3,<3",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
hopin = "hopin.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv]
# The overnightworks libraries are built from their git tags; a named package
# overrides a global --no-build, so every other package still installs as a wheel.
no-binary-package = [
    "overnightworks-agents",
    "overnightworks-design",
    "overnightworks-logline",
    "overnightworks-speech-client",
    "overnightworks-tandem",
    "overnightworks-video-client",
    "overnightworks-webauth",
]
# Their build backends run with these exact tools, as hatchling is pinned above.
build-constraint-dependencies = ["setuptools==84.2.1", "wheel==0.48.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hopin"]
# .gitignore excludes build/, which hatch would otherwise skip.
# The page build's source maps are for the coverage report; the package serves none.
artifacts = ["src/hopin/web/build", "!*.map"]

# --- Ruff ---

[tool.ruff]
src = [".", "src"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "PT",     # flake8-pytest-style
    "TID",    # flake8-tidy-imports
]
ignore = []
# quality owns S and T20; its noqa lines would read as unused here
external = ["S", "T20"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["fastapi.APIRouter.api_route", "fastapi.APIRouter.get"]

# Every process admits the same session only because the accounts and sessions live in Postgres; webauth's
# single-process stores keep them in one process's memory, so only the tests build them. import-linter takes no
# submodule of an external package, so this rule guards production (`src`) instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"webauth.single_process_stores".msg = "Production builds the accounts and sessions over Postgres (hopin.stores.postgres.PostgresIdentity)"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",     # relax annotations in tests
    "ARG",     # allow unused arguments in fixtures
    "TID251",  # the in-thread tests build webauth's single-process stores
]
# design-catalogs writes this module; its lines are as long as the sentences they carry.
"src/hopin/words.py" = ["E501"]

[tool.design-catalogs]
python = "src/hopin/words.py"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_typed = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing",
]
# The slowest unit test takes under 1 s, so one still running after 120 s is stuck; any test past it dumps every thread's stack.
faulthandler_timeout = 120
markers = [
    "integration: integration tests",
    "e2e: browser end-to-end tests",
    "shared_stores: tests of hopin's shared stores and the database settings `hopin migrate` reads, which the Shared stores job runs: most need a live Redis and Postgres (HOPIN_TEST_REDIS_URL, HOPIN_TEST_POSTGRES_URL)",
]

# --- Coverage ---

[tool.coverage.run]
# The measured set has one owner, here: `--cov` in addopts turns measurement
# on and takes its sources from this key, so every way of running the suite
# measures the same files. Naming the set in the CI command instead let the
# local run pass over an uncovered line that CI then
# turned red for.
source = ["src"]
branch = true
# The unit, shared-stores and end-to-end runs happen on different runners; relative paths
# let their data combine.
relative_files = true
# design-catalogs writes this module and design tests its lookup; hopin owns none of its logic.
omit = ["src/hopin/words.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
show_missing = true

# --- Vulture ---

[tool.vulture]
paths = ["src/hopin"]
min_confidence = 80

# --- Import contracts ---

[tool.importlinter]
root_packages = ["hopin"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "HopIn's packages depend downwards only"
type = "layers"
containers = ["hopin"]
# Every top-level module of hopin stands in exactly one layer, so a new one is
# placed by a decision rather than slipping in between. `main` starts the server
# and `app` is the composition root: nothing imports `main`, and only `main`
# imports `app`. The game, participation and Skat are optional: each plugs into signaling's
# feature port, `main` switches it in, and deleting the game needs no contract edit. The
# agent connector stands above both: it composes the game on the client's backend and
# serves participation over MCP, and neither knows it. The person export
# and its erasure join sign-in's sessions with signaling's seats, so `people` sits above both.
# Sign-in sits above the web routes it guards, the routes above the signaling and
# room services they are handed, and `config` and `words` (the catalog's generated sentences) are the floor every package reads.
exhaustive = true
layers = ["main", "app", "(agent)", "(game) | (participation) | (stage)", "people", "auth", "web", "signaling", "rooms", "errors", "stores", "config | words"]

[[tool.importlinter.contracts]]
id = "signaling-layers"
name = "Signaling's modules depend downwards only"
type = "layers"
containers = ["hopin.signaling"]
# The handler drives the call's feature and room routing; the feature port reads and sends through routing;
# routing drives the call through the store's transitions; the store commits seats and rooms, whose seats keep the replay
# logs; replay logs hold frames.
layers = ["handler", "features", "routing", "transition", "seats", "replay", "frames"]

[[tool.importlinter.contracts]]
id = "sign-in-knows-no-call"
name = "Sign-in names no room and no signaling"
type = "forbidden"
# The layer order lets auth reach the call services below web; sign-in has no
# reason to. A session's end reaches a call only through what app wires together.
source_modules = ["hopin.auth"]
forbidden_modules = ["hopin.rooms", "hopin.signaling"]

[[tool.importlinter.contracts]]
id = "call-core-knows-no-game"
name = "The call core knows no game"
type = "forbidden"
# The game must stay removable and participation optional: the call core reaches neither them nor the agent
# connector and the client and HTTP library under them, not even through another module.
source_modules = [
    "hopin.people",
    "hopin.auth",
    "hopin.web",
    "hopin.signaling",
    "hopin.rooms",
    "hopin.errors",
    "hopin.config",
]
forbidden_modules = [
    "hopin.game",
    "hopin.participation",
    "hopin.stage",
    "hopin.agent",
    "agents",
    "agent_runtime_client",  # stays forbidden beside agents, because quality's gate counts a struck forbidden module as a loosening
    "speech_client",
    "speech_runtime_client",
    "video_client",
    "httpx2",
]

[[tool.importlinter.contracts]]
id = "participation-knows-no-agent-runtime"
name = "Participation names no agent runtime"
type = "forbidden"
# Participation holds who is in a call, with no AI in it; the connector adapts it to the runtime's tools.
source_modules = ["hopin.participation"]
# agent_runtime_client stays forbidden beside agents, because quality's gate counts a struck forbidden module as a loosening.
forbidden_modules = ["agents", "agent_runtime_client", "speech_client", "speech_runtime_client", "video_client", "httpx2"]
# Participation reaches only the calling standard and the member records of the agents library.
ignore_imports = ["hopin.participation.** -> agents.calling", "hopin.participation.** -> agents.member"]

[[tool.importlinter.contracts]]
id = "agent-service-only-through-the-game"
name = "Only the game reaches the agent service"
type = "forbidden"
# The agents library and its HTTP library are the connector's alone.
# agent_runtime_client stays forbidden beside agents, because quality's gate counts a struck forbidden module as a loosening.
source_modules = ["hopin.main", "hopin.app"]
forbidden_modules = ["agents", "agent_runtime_client", "httpx2"]
# main imports hopin.agent to switch the game in; only a direct import is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "speech-service-only-through-the-connector"
name = "Only the connector reaches the speech service"
type = "forbidden"
# The speech client, under either of its distribution names, and the video client are the connector's alone; the video service shares this contract.
source_modules = ["hopin.main", "hopin.app"]
forbidden_modules = ["speech_client", "speech_runtime_client", "video_client"]
# main imports hopin.agent to switch the game in; only a direct import is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "rooms-are-plain-python"
name = "Rooms name no web framework and no sign-in library"
type = "forbidden"
# Room and participant rules are pure logic, callable and testable without a
# server, a socket or a session.
source_modules = ["hopin.rooms"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "websockets", "webauth", "sqlalchemy", "alembic", "psycopg"]

[[tool.importlinter.contracts]]
id = "database-only-through-stores"
name = "Only the stores reach the database libraries"
type = "forbidden"
# The engine, the migrations and the sessions' tables are `hopin.stores`'s; everything else gets what the stores hand it.
source_modules = [
    "hopin.main",
    "hopin.app",
    "hopin.agent",
    "hopin.game",
    "hopin.participation",
    "hopin.stage",
    "hopin.people",
    "hopin.auth",
    "hopin.web",
    "hopin.signaling",
    "hopin.rooms",
    "hopin.errors",
    "hopin.config",
    "hopin.words",
]
forbidden_modules = ["sqlalchemy", "alembic", "psycopg"]
# main imports hopin.stores.postgres, which imports them; only a direct import is the violation.
allow_indirect_imports = true

[dependency-groups]
dev = [
    # Before 7.17.4, lines other threads recorded during a data flush were lost, and a data file could be named with
    # the hash of other data, so combining skipped it as a duplicate: a covered line then read as missed.
    "coverage>=7.17.4",
    "cryptography>=50.0.2",
    "fakeredis[lua]>=2.35,<3",
    "httpx2>=2.13.1",
    "mypy>=1.19.1",
    "overnightworks-design[catalogs] @ git+https://github.com/overnightworks/design@v0.41.0",
    "pyjwt>=2.15.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.10.0",
    "pytest-randomly>=5.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "vulture>=2.15",
]
