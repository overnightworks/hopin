[project]
name = "hopin"
version = "0.1.0"
description = "Self-hosted video call service using WebRTC"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.123.7",
    "overnightworks-webauth @ https://github.com/overnightworks/webauth/releases/download/v0.22.0/overnightworks_webauth-0.22.0-py3-none-any.whl",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "urllib3>=2.6.3,<3",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
hopin = "hopin.main:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hopin"]

# --- Ruff ---

[tool.ruff]
src = ["src", "scripts", "tests"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "PT",     # flake8-pytest-style
]
ignore = []

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["fastapi.APIRouter.api_route", "fastapi.APIRouter.get"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # allow assert in tests
    "S104",    # allow binding to all interfaces in test assertions
    "ANN",     # relax annotations in tests
    "ARG",     # allow unused arguments in fixtures
    "SLF001",  # allow private member access for unit testing internals
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_typed = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: browser end-to-end tests",
]

# --- Coverage ---

[tool.coverage.run]
# The measured set has one owner, here: `--cov` in addopts turns measurement
# on and takes its sources from this key, so every way of running the suite
# measures the same files. `scripts` is measured next to the package because
# the scanner analyses it too (sonar.sources in sonar-project.properties), and
# an analysed file with no coverage data reports as wholly uncovered. Naming
# the set in the CI command instead let the local run and the pre-commit hook
# pass over an uncovered line that CI then turned red for.
source = ["src", "scripts"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
show_missing = true

# --- Vulture ---

[tool.vulture]
paths = ["src/hopin"]
min_confidence = 80

# --- Import contracts ---

[tool.importlinter]
root_packages = ["hopin"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "HopIn's packages depend downwards only"
type = "layers"
containers = ["hopin"]
# Every top-level module of hopin stands in exactly one layer, so a new one is
# placed by a decision rather than slipping in between. `main` starts the server
# and `app` is the composition root: nothing imports `main`, and only `main`
# imports `app`. The person export joins sign-in's sessions with signaling's
# seats, so `people` sits above both. Sign-in sits above the web routes it
# guards, the routes above the signaling and room services they are handed, and
# `config` is the floor every package reads.
exhaustive = true
layers = ["main", "app", "people", "auth", "web", "signaling", "rooms", "errors", "config"]

[[tool.importlinter.contracts]]
id = "sign-in-knows-no-call"
name = "Sign-in names no room and no signaling"
type = "forbidden"
# The layer order lets auth reach the call services below web; sign-in has no
# reason to. A session's end reaches a call only through what app wires together.
source_modules = ["hopin.auth"]
forbidden_modules = ["hopin.rooms", "hopin.signaling"]
# auth imports two values from hopin.web.routes, which names the handler and the
# room manager for type checking only; only a direct import is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "rooms-are-plain-python"
name = "Rooms name no web framework and no sign-in library"
type = "forbidden"
# Room and participant rules are pure logic, callable and testable without a
# server, a socket or a session.
source_modules = ["hopin.rooms"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "websockets", "webauth"]
# hopin.config.constants holds webauth's rate-limit values, so every package
# reaches webauth through config; only a direct import is the violation.
allow_indirect_imports = true

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx2>=2.13.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pyjwt>=2.15.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.0",
    "vulture>=2.15",
]
