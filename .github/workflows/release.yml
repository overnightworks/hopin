name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release as YYYY.MM.DD.N, without a v
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@8a01f2aec4cb5e905a851a306041bad0465ce7d2 # v0.22.1
    with:
      version: ${{ inputs.version }}
      form: YYYY.MM.DD.N

  image:
    name: Image
    needs: gate
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: overnightworks/quality/.github/workflows/image.yml@8a01f2aec4cb5e905a851a306041bad0465ce7d2 # v0.22.1
    with:
      context: .
      file: Dockerfile
      version: ${{ inputs.version }}
      push: true

  # The probe image carries the version of hopin's image with a suffix, so the probe and the page it reads match.
  image-probe:
    name: Image (probe)
    needs: gate
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: overnightworks/quality/.github/workflows/image.yml@8a01f2aec4cb5e905a851a306041bad0465ce7d2 # v0.22.1
    with:
      context: .
      file: Dockerfile
      target: probe
      version: ${{ inputs.version }}-probe
      push: true

  tag:
    name: Tag
    needs: [gate, image, image-probe]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@8a01f2aec4cb5e905a851a306041bad0465ce7d2 # v0.22.1
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
