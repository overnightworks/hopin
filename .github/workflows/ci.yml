name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test with coverage
        run: uv run pytest -q --cov=src --cov-report=xml:coverage.xml

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scan step above blocks on the analysis (sonar.qualitygate.wait=true
      # in sonar-project.properties), so the report this reads is already
      # final. The quality gate itself passes on ratings (A/B/C), not on "0
      # findings on new code"; this queries the public API directly for that
      # stronger bar and fails loud, with the list, when it is not met. No
      # token: the project is public. issueStatuses includes ACCEPTED and
      # FALSE_POSITIVE, not just OPEN/CONFIRMED: the SonarCloud UI is never
      # the place to silence a finding, so an accepted-in-the-UI finding must
      # still fail this gate.
      - name: SonarCloud open findings
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          component_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            scope_query="pullRequest=${PULL_REQUEST_NUMBER}"
          else
            scope_query="branch=master"
          fi
          python3 - "${component_key}" "${scope_query}" <<'PYTHON'
          import json
          import sys
          import urllib.request

          component_key, scope_query = sys.argv[1], sys.argv[2]

          def fetch_page(page: int) -> dict:
              url = (
                  "https://sonarcloud.io/api/issues/search"
                  f"?componentKeys={component_key}&{scope_query}&issueStatuses=OPEN,CONFIRMED,ACCEPTED,FALSE_POSITIVE&ps=100&p={page}"
              )
              with urllib.request.urlopen(url) as response:
                  return json.load(response)

          page = 1
          printed = 0
          total = None
          while total is None or printed < total:
              report = fetch_page(page)
              total = report["total"]
              for issue in report["issues"]:
                  file_path = issue["component"].split(":", 1)[1]
                  line = issue.get("line", "?")
                  print(f'{issue["rule"]} {file_path}:{line} {issue["message"]}')
                  printed += 1
              if not report["issues"]:
                  break
              page += 1

          if total > 0:
              print(f"{total} open SonarCloud finding(s) in scope {scope_query}", file=sys.stderr)
              sys.exit(1)
          PYTHON
