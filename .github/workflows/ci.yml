name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint and test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"

      # This is the only step that installs, and it installs only what the
      # lockfile resolved, as wheels: --locked refuses a stale lock instead of
      # resolving fresh versions, and --no-build refuses a source distribution,
      # whose build script runs third-party code on the runner. hopin itself
      # stays out of the environment: it is the one source build left once the
      # dependencies are wheels, and nothing below needs it installed, because
      # pytest puts src/ on the import path (pyproject.toml,
      # tool.pytest.ini_options.pythonpath). The steps below then call their
      # tool straight from that environment instead of installing again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # The Makefile owns what lint means. UV_NO_SYNC keeps its `uv run` calls
      # on the environment installed above instead of installing the project.
      - name: Lint
        env:
          UV_NO_SYNC: "1"
        run: make lint

      - name: Find dead code
        env:
          UV_NO_SYNC: "1"
        run: make dead

      # Which files are measured is pyproject.toml's to say (the source key
      # under [tool.coverage.run]). 100 % is judged by the Coverage job over
      # the unit and end-to-end data together, not here.
      - name: Test with coverage
        env:
          COVERAGE_FILE: .coverage.unit
        run: pytest -q -m "not e2e"

      - name: Upload the unit coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the page build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page-build
          path: src/hopin/web/build

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # apt on the runner can stall on a slow mirror; each attempt is bounded so
      # a stall costs one retry instead of the test budget.
      - name: Install Chromium
        id: install-chromium
        continue-on-error: true
        timeout-minutes: 6
        run: playwright install --with-deps chromium

      - name: Install Chromium again
        if: steps.install-chromium.outcome == 'failure'
        timeout-minutes: 6
        run: |
          # The timed-out attempt leaves its apt-get running and holding the dpkg lock.
          sudo pkill -x apt-get || true
          sudo pkill -x apt || true
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 1; done
          playwright install --with-deps chromium

      - name: Run the end-to-end tests
        timeout-minutes: 10
        env:
          COVERAGE_FILE: .coverage.e2e
          HOPIN_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        run: pytest -m e2e --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Upload the end-to-end coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-e2e
          path: .coverage.e2e
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # Reported, not judged: no threshold. The page build's hidden source maps map Chromium's coverage to frontend/src.
      - name: Convert the browser coverage to lcov
        working-directory: frontend
        env:
          HOPIN_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        run: |
          pnpm install --frozen-lockfile
          node scripts/browser-coverage-report.js "${HOPIN_BROWSER_COVERAGE_DIR}" ../src/hopin/web/build ../browser-coverage

      - name: Upload the browser coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-coverage
          path: browser-coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Report how much longer this job ran than on main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          duration() {
            local run_id=$1
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq \
              '.jobs[] | select(.name == "End-to-end") | (.completed_at // (now | todate) | fromdate) - (.started_at | fromdate)'
          }
          main_run=$(gh run list --branch main --workflow ci.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          this_duration=$(duration "${GITHUB_RUN_ID}")
          main_duration=$(duration "${main_run}")
          echo "End-to-end so far: ${this_duration} s; main's last green run (${main_run}): ${main_duration} s; longer by $((this_duration - main_duration)) s"

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 1

  coverage:
    name: Coverage
    needs: [ci, e2e, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Fetch the coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Fetch the frontend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      # The branch contract: 100 % over unit, integration and end-to-end
      # together. The xml is the report the quality gate's scan reads.
      - name: Judge the combined coverage
        run: |
          coverage combine .coverage.unit .coverage.e2e
          coverage report --fail-under=100
          coverage xml -o coverage.xml

      - name: Upload the coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  removal-drill:
    name: Removal drill
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      COPY: ${{ github.workspace }}-without-the-game
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"

      # Fetched before the copy, so the copy carries the build the page is served from.
      - name: Fetch the page build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page-build
          path: src/hopin/web/build

      # The AI game must stay removable: the script edits only this copy, and
      # everything below runs there, so a core module that reaches the game
      # fails here.
      - name: Remove the game from a copy
        run: |
          cp -a "${GITHUB_WORKSPACE}" "${COPY}"
          python3 scripts/remove_game.py "${COPY}"

      - name: Install dependencies
        working-directory: ${{ env.COPY }}
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Run the unit tests
        working-directory: ${{ env.COPY }}
        run: pytest -q -m "not e2e" --no-cov

      # Same bounded retry as the End-to-end job: a stalled apt must not turn
      # the mandatory drill red at random.
      - name: Install Chromium
        id: install-chromium
        working-directory: ${{ env.COPY }}
        continue-on-error: true
        timeout-minutes: 6
        run: playwright install --with-deps chromium

      - name: Install Chromium again
        if: steps.install-chromium.outcome == 'failure'
        working-directory: ${{ env.COPY }}
        timeout-minutes: 6
        run: |
          # The timed-out attempt leaves its apt-get running and holding the dpkg lock.
          sudo pkill -x apt-get || true
          sudo pkill -x apt || true
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 1; done
          playwright install --with-deps chromium

      - name: Run a call end to end
        working-directory: ${{ env.COPY }}
        timeout-minutes: 5
        run: pytest -q -m e2e tests/e2e/test_call.py --no-cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from packageManager in frontend/package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload the frontend coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Upload the page build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-build
          path: src/hopin/web/build
          if-no-files-found: error
          retention-days: 1

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image without pushing it
        run: docker build --tag hopin-image .

      # The wheel is gone from the image; its record of installed files remains.
      - name: Check that the wheel carries the page build
        run: >
          docker run --rm --entrypoint python hopin-image -c
          "from importlib.metadata import files; assert any(str(f) == 'hopin/web/build/index.html' for f in files('hopin'))"

  quality:
    name: quality
    needs: [ci, e2e, coverage, removal-drill, frontend, image]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@0512e98cff3190c9bec855e6bc753180ab3aae02 # v0.9.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
