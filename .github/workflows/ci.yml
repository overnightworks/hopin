name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint and test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"

      # This is the only step that installs, and it installs only what the
      # lockfile resolved, as wheels: --locked refuses a stale lock instead of
      # resolving fresh versions, and --no-build refuses a source distribution,
      # whose build script runs third-party code on the runner. hopin itself
      # stays out of the environment: it is the one source build left once the
      # dependencies are wheels, and nothing below needs it installed, because
      # pytest puts src/ and scripts/ on the import path (pyproject.toml,
      # tool.pytest.ini_options.pythonpath). The steps below then call their
      # tool straight from that environment instead of installing again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # The Makefile owns what lint means. UV_NO_SYNC keeps its `uv run` calls
      # on the environment installed above instead of installing the project.
      - name: Lint
        env:
          UV_NO_SYNC: "1"
        run: make lint

      - name: Check the repository root layout
        run: python scripts/check_root_layout.py

      # Which files are measured is pyproject.toml's to say (the source key
      # under [tool.coverage.run]); this step only asks for the report the
      # quality gate's scan reads, so a local run, the pre-commit hook and CI
      # cannot disagree about the measured set.
      - name: Test with coverage
        run: pytest -q -m "not e2e" --cov-report=xml:coverage.xml

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pytest -m e2e --no-cov --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 1

  quality:
    name: quality
    needs: [ci, e2e]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@02fbdd0fb1873b9ba91ba7735886ff6f700da1cc # v0.5.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
