name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # This is the only step that installs, and it installs only what the
      # lockfile resolved, as wheels: --locked refuses a stale lock instead of
      # resolving fresh versions, and --no-build refuses a source distribution,
      # whose build script runs third-party code on the runner. hopin itself
      # stays out of the environment: it is the one source build left once the
      # dependencies are wheels, and nothing below needs it installed, because
      # pytest puts src/ and scripts/ on the import path (pyproject.toml,
      # tool.pytest.ini_options.pythonpath). The steps below then call their
      # tool straight from that environment instead of installing again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Lint
        run: ruff check .

      - name: Check the repository root layout
        run: python scripts/check_root_layout.py

      # Which files are measured is pyproject.toml's to say (the source key
      # under [tool.coverage.run]); this step only asks for the report the
      # scanner reads, so a local run, the pre-commit hook and CI cannot
      # disagree about the measured set.
      - name: Test with coverage
        run: pytest -q --cov-report=xml:coverage.xml

      # SONAR_TOKEN is empty for fork-originated pull requests, and this
      # repository's CI carries the scanner, so Automatic Analysis is off and
      # such a pull request produces no analysis at all. Skip both scan steps
      # there; the push to master and same-repo pull requests still run them.
      # The condition sits on the steps rather than the job because this job
      # also carries lint and tests, which a fork's pull request must keep.
      - name: Scan with SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The check that carries these steps is named "Lint, test, and scan", so
      # a silent skip reports a scan that never happened. A skip nobody can see
      # is the same defect as a success that prints nothing.
      - name: Report the skipped SonarCloud scan
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: >-
          echo "SonarCloud skipped: this pull request comes from a fork, which
          receives no SONAR_TOKEN, and this repository's CI carries the scanner,
          so no analysis exists for this pull request to read. This run asserts
          lint, the root layout and the tests only; the code is scanned once it
          runs from a branch in this repository."

      # The scan step above blocks on the analysis (sonar.qualitygate.wait=true
      # in sonar-project.properties), so the report this reads is already
      # final. The quality gate itself passes on ratings (A/B/C), not on "0
      # findings on new code"; the fleet's gate queries the API directly for
      # that stronger bar and fails loud, with the list, when it is not met. It
      # reads this repository's own sonar-project.properties from the
      # workspace, and it needs a credential: this repository's CI carries the
      # scanner, and the credential that reads an analysis must be the one that
      # produced it (CLAUDE.md, "SonarCloud").
      - name: SonarCloud open findings
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # The per-call timeout gives the honest message; this is the hard
        # ceiling, because the gate pages and a per-call bound multiplies. A
        # composite action's inner steps take no timeout-minutes, so the
        # ceiling belongs to the calling step.
        timeout-minutes: 5
        uses: overnightworks/marketplace/.github/actions/sonar-findings-gate@0f73f6e0331bae6de7ea800e3f7551c2a49c8058 # sonar-findings-gate-v1
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
