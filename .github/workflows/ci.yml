name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # This is the only step that installs, and it installs only what the
      # lockfile resolved, as wheels: --locked refuses a stale lock instead of
      # resolving fresh versions, and --no-build refuses a source distribution,
      # whose build script runs third-party code on the runner. hopin itself
      # stays out of the environment: it is the one source build left once the
      # dependencies are wheels, and nothing below needs it installed, because
      # pytest puts src/ and scripts/ on the import path (pyproject.toml,
      # tool.pytest.ini_options.pythonpath). The steps below then call their
      # tool straight from that environment instead of installing again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Lint
        run: ruff check .

      - name: Check the repository root layout
        run: python scripts/check_root_layout.py

      # Which files are measured is pyproject.toml's to say (the source key
      # under [tool.coverage.run]); this step only asks for the report the
      # scanner reads, so a local run, the pre-commit hook and CI cannot
      # disagree about the measured set.
      - name: Test with coverage
        run: pytest -q --cov-report=xml:coverage.xml

      # SONAR_TOKEN is empty for fork-originated pull requests, and this
      # repository's CI carries the scanner, so Automatic Analysis is off and
      # such a pull request produces no analysis at all. Skip both scan steps
      # there; the push to master and same-repo pull requests still run them.
      # The condition sits on the steps rather than the job because this job
      # also carries lint and tests, which a fork's pull request must keep.
      - name: Scan with SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The check that carries these steps is named "Lint, test, and scan", so
      # a silent skip reports a scan that never happened. A skip nobody can see
      # is the same defect as a success that prints nothing.
      - name: Report the skipped SonarCloud scan
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: >-
          echo "SonarCloud skipped: this pull request comes from a fork, which
          receives no SONAR_TOKEN, and this repository's CI carries the scanner,
          so no analysis exists for this pull request to read. This run asserts
          lint, the root layout and the tests only; the code is scanned once it
          runs from a branch in this repository."

      # The scan step above blocks on the analysis (sonar.qualitygate.wait=true
      # in sonar-project.properties), so the report this reads is already
      # final. The quality gate itself passes on ratings (A/B/C), not on "0
      # findings on new code"; this queries the API directly for that stronger
      # bar and fails loud, with the list, when it is not met. Unlike the
      # reference this SonarCloud project is public, so no credential is
      # needed to read it; the step sends one anyway, because the credential
      # that reads an analysis must be the one that produced it (CLAUDE.md,
      # "SonarCloud"), and this repository's own CI carries the scanner, so
      # that token is present wherever this step runs. It is basic auth user
      # name with an empty password, never printed. issueStatuses includes
      # ACCEPTED and FALSE_POSITIVE, not
      # just OPEN/CONFIRMED: the SonarCloud UI is never the place to silence a
      # finding, so an accepted-in-the-UI finding must still fail this gate.
      - name: SonarCloud open findings
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # The per-call timeout gives the honest message; this is the hard
        # ceiling, because the step pages and a per-call bound multiplies.
        timeout-minutes: 5
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          component_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            scope_name="pullRequest"
            scope_value="${PULL_REQUEST_NUMBER}"
          else
            scope_name="branch"
            scope_value="${GITHUB_REF_NAME}"
          fi
          python3 - "${component_key}" "${scope_name}" "${scope_value}" <<'PYTHON'
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          # A SonarCloud that accepts the connection and then stops answering
          # must fail the job. This bounds one call; the step's own
          # timeout-minutes bounds the paging above it.
          REQUEST_TIMEOUT_SECONDS = 30

          component_key, scope_name, scope_value = sys.argv[1], sys.argv[2], sys.argv[3]
          scope_parameters = {scope_name: scope_value}
          scope_label = f"{scope_name}={scope_value}"
          credentials = base64.b64encode(f'{os.environ["SONAR_TOKEN"]}:'.encode()).decode()


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              # A redirect would forward the Authorization header to another
              # host; raise instead of following it.
              def redirect_request(self, *args, **kwargs):
                  return None


          opener = urllib.request.build_opener(NoRedirect())

          def timed_out(error: OSError) -> bool:
              # A read that runs out of time raises TimeoutError itself, while a
              # connect that does arrives wrapped in URLError.
              return isinstance(error, TimeoutError) or (
                  isinstance(error, urllib.error.URLError)
                  and isinstance(error.reason, TimeoutError)
              )

          def scoped_api_url(endpoint: str, **parameters: object) -> str:
              # The scope carries a branch name the runner derived, and a ref name
              # may legally contain characters a query string reads differently.
              query = urllib.parse.urlencode({**parameters, **scope_parameters})
              return f"https://sonarcloud.io/api/{endpoint}?{query}"

          def fetch(url: str) -> dict:
              request = urllib.request.Request(
                  url, headers={"Authorization": f"Basic {credentials}"}
              )
              try:
                  with opener.open(request, timeout=REQUEST_TIMEOUT_SECONDS) as response:
                      return json.load(response)
              except OSError as error:
                  if not timed_out(error):
                      raise
                  sys.exit(
                      f"SonarCloud did not answer within {REQUEST_TIMEOUT_SECONDS}s: "
                      f"the request for {component_key} in scope {scope_label} timed "
                      "out. Its findings were never read, so re-run the job before "
                      "investigating SonarCloud."
                  )

          def fetch_page(page: int) -> dict:
              return fetch(
                  scoped_api_url(
                      "issues/search",
                      componentKeys=component_key,
                      issueStatuses="OPEN,CONFIRMED,ACCEPTED,FALSE_POSITIVE",
                      ps=100,
                      p=page,
                  )
              )

          def require_resolved_scope() -> None:
              # An unauthenticated, misspelled or never-analysed scope answers
              # the issue search with zero findings and no error, so read the
              # measures of this exact scope first: it is 404 when the token,
              # the key or the scope does not resolve.
              try:
                  fetch(scoped_api_url("measures/component", component=component_key, metricKeys="ncloc"))
              except urllib.error.HTTPError as error:
                  sys.exit(
                      f"SonarCloud did not resolve {component_key} in scope "
                      f"{scope_label} (HTTP {error.code}): either no analysis "
                      "exists for this scope — an unanalysed branch, a pull "
                      "request that does not exist, a mistyped key — or the "
                      "credential cannot see the project. Its findings were "
                      "never read."
                  )

          require_resolved_scope()

          page = 1
          printed = 0
          total = None
          while total is None or printed < total:
              report = fetch_page(page)
              total = report["total"]
              for issue in report["issues"]:
                  file_path = issue["component"].split(":", 1)[1]
                  line = issue.get("line", "?")
                  print(f'{issue["rule"]} {file_path}:{line} {issue["message"]}')
                  printed += 1
              if not report["issues"]:
                  break
              page += 1

          if total > 0:
              print(f"{total} open SonarCloud finding(s) in scope {scope_label}", file=sys.stderr)
              sys.exit(1)

          # A step that prints nothing on success cannot be shown to have run.
          print(f"SonarCloud clean for '{component_key}' ({scope_label}): {total} open finding(s)")
          PYTHON
