name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its running predecessor. Every other run has a group of its own: runs on
# main share a ref, and GitHub drops a queued run from a shared group whatever cancel-in-progress says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint and test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      # This is the only step that installs, and it installs only what the
      # lockfile resolved: --locked refuses a stale lock instead of resolving
      # fresh versions. Only two builds are allowed, the git-pinned
      # overnightworks libraries named in pyproject.toml (tool.uv), run with
      # exact build tools; --no-build refuses every other source distribution,
      # whose build script would run third-party code on the runner, so third-party
      # packages are wheel-only. hopin itself stays out of the environment: nothing
      # below needs it installed, because pytest puts src/ on the import path
      # (pyproject.toml, tool.pytest.ini_options.pythonpath). The steps below then
      # call their tool straight from that environment instead of installing again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # The Makefile owns what lint means. UV_NO_SYNC keeps its `uv run` calls
      # on the environment installed above instead of installing the project.
      - name: Lint
        env:
          UV_NO_SYNC: "1"
        run: make lint

      - name: Find dead code
        env:
          UV_NO_SYNC: "1"
        run: make dead

      # Which files are measured is pyproject.toml's to say (the source key
      # under [tool.coverage.run]). 100 % is judged by the Coverage job over
      # the unit and end-to-end data together, not here.
      - name: Test with coverage
        env:
          COVERAGE_FILE: .coverage.unit
        run: pytest -q -n auto -m "not e2e"

      - name: Upload the unit coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    name: End-to-end shard ${{ matrix.shard }}
    # One runner per shard: a runner's cores are the limit, so only more runners shorten the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    needs: frontend
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the page build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page-build
          path: src/hopin/web/build

      # The game's and the participation figure's tests find their hashed chunks through the build's own manifest.
      - name: Fetch the client manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-manifest
          path: frontend/.svelte-kit/output/client/.vite

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # The image is pinned because the libraries Chromium needs come with it; installing them through apt stalls now
      # and then, so --with-deps is not used.
      - name: Install Chromium
        timeout-minutes: 3
        run: playwright install chromium

      - name: Run the end-to-end tests
        timeout-minutes: 10
        env:
          COVERAGE_FILE: .coverage.e2e-${{ matrix.shard }}
          HOPIN_E2E_SHARD: ${{ matrix.shard }}
          HOPIN_E2E_SHARDS: 3
          HOPIN_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        run: pytest -n 2 -m e2e --durations=20 --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Upload the end-to-end coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-e2e-${{ matrix.shard }}
          path: .coverage.e2e-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the raw browser coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-coverage-raw-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-coverage-raw
          if-no-files-found: error
          retention-days: 1

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 1

  # The mandatory job of the quality gate. It stands for the shards: green only when every shard concluded success,
  # so a failed, skipped or cancelled shard turns it red. It converts the browser coverage once because the
  # conversion fails on a shipped source with code and no record in any shard.
  e2e:
    name: End-to-end
    needs: [frontend, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every shard to have passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "end-to-end shards: ${SHARDS}"
          [ "${SHARDS}" = success ]

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the page build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page-build
          path: src/hopin/web/build

      - name: Fetch the raw browser coverage of every shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-coverage-raw-*
          merge-multiple: true
          path: ${{ runner.temp }}/browser-coverage-raw

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The page build's hidden source maps map Chromium's coverage to frontend/src. The step fails on a shipped source
      # with code and no record; the Coverage job judges the merged report.
      - name: Convert the browser coverage to lcov
        working-directory: frontend
        env:
          HOPIN_BROWSER_COVERAGE_DIR: ${{ runner.temp }}/browser-coverage-raw
        run: |
          pnpm install --frozen-lockfile
          node scripts/browser-coverage-report.js "${HOPIN_BROWSER_COVERAGE_DIR}" ../src/hopin/web/build ../browser-coverage

      - name: Upload the browser coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-coverage
          path: browser-coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Report how much longer the slowest shard ran than on main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Main's last green run before the shards ran the suite in the one job "End-to-end".
          duration() {
            local run_id=$1
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq \
              '[.jobs[] | select(.name | test("^End-to-end( shard .)?$")) | (.completed_at // (now | todate) | fromdate) - (.started_at | fromdate)] | max'
          }
          main_run=$(gh run list --branch main --workflow ci.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          this_duration=$(duration "${GITHUB_RUN_ID}")
          main_duration=$(duration "${main_run}")
          echo "Slowest end-to-end shard: ${this_duration} s; main's last green run (${main_run}): ${main_duration} s; longer by $((this_duration - main_duration)) s"

  coverage:
    name: Coverage
    needs: [ci, e2e, e2e-shard, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Fetch the coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Fetch the frontend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Fetch the browser coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-coverage
          path: browser-coverage

      # The branch contract: 100 % over unit, integration and end-to-end
      # together. The xml is the report the quality gate's scan reads.
      - name: Judge the combined coverage
        run: |
          coverage combine .coverage.unit .coverage.e2e-*
          coverage report --fail-under=100
          coverage xml -o coverage.xml

      # Vitest's records stand for the files it reports; the browser's cover the rest. The script fails below 100 %.
      - name: Merge the frontend coverage
        run: python scripts/merge_frontend_coverage.py frontend/coverage/lcov.info browser-coverage/lcov.info frontend/coverage/merged-lcov.info

      - name: Upload the coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            frontend/coverage/merged-lcov.info
          if-no-files-found: error
          retention-days: 1

  removal-drill-leg:
    name: Removal drill leg
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: [game, skat]
    env:
      COPY: ${{ github.workspace }}-without-${{ matrix.feature }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      # Each optional feature must stay removable: the script edits only this
      # copy, and everything below runs there, so a core module that reaches
      # the feature fails here.
      - name: Remove the feature from a copy
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          cp -a "${GITHUB_WORKSPACE}" "${COPY}"
          python3 scripts/remove_feature.py "${FEATURE}" "${COPY}"

      - name: Install dependencies
        working-directory: ${{ env.COPY }}
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      # The page the call runs in is built in the copy, so a core module that
      # reaches the feature fails the check or the build here too.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the frontend dependencies
        working-directory: ${{ env.COPY }}/frontend
        run: pnpm install --frozen-lockfile

      - name: Check the frontend
        working-directory: ${{ env.COPY }}/frontend
        run: pnpm check

      - name: Build the page
        working-directory: ${{ env.COPY }}/frontend
        run: pnpm build

      - name: Run the unit tests
        working-directory: ${{ env.COPY }}
        run: pytest -q -n auto -m "not e2e" --no-cov

      - name: Install Chromium
        working-directory: ${{ env.COPY }}
        timeout-minutes: 3
        run: playwright install chromium

      - name: Run a call end to end
        working-directory: ${{ env.COPY }}
        timeout-minutes: 5
        # pytest-workers: one module and one server, its tests share it, so -n would only add startups.
        run: pytest -q -m e2e tests/e2e/test_call.py --no-cov

  # The quality gate counts a matrix leg by its own name, so the one name it requires is this job: green only when
  # every leg is.
  removal-drill:
    name: Removal drill
    needs: removal-drill-leg
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every leg to have passed
        env:
          LEGS: ${{ needs.removal-drill-leg.result }}
        run: |
          echo "removal drill legs: ${LEGS}"
          [ "${LEGS}" = success ]

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from packageManager in frontend/package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload the frontend coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Upload the page build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-build
          path: src/hopin/web/build
          if-no-files-found: error
          retention-days: 1

      - name: Upload the client manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-manifest
          path: frontend/.svelte-kit/output/client/.vite/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image without pushing it
        run: docker build --tag hopin-image .

      # The wheel is gone from the image; its record of installed files remains.
      - name: Check that the wheel carries the page build
        run: >
          docker run --rm --entrypoint python hopin-image -c
          "from importlib.metadata import files; assert any(str(f) == 'hopin/web/build/index.html' for f in files('hopin'))"

  quality:
    name: quality
    needs: [ci, e2e-shard, e2e, coverage, removal-drill, frontend, image]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@f7723bafb716c987013d40b5e0eaba18e58f311c # v0.11.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
