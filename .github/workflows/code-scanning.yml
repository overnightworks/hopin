name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@07bdf7c478ac9cc9cd348b180abd3cbc9d873f23 # v0.9.2
    with:
      languages: '["actions", "javascript-typescript", "python"]'
