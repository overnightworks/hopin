name: CodeQL

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@3f67b59b73fb5f9b29f46fdb0646b06f6f070cc0 # v0.3.1
    with:
      languages: '["actions", "javascript-typescript", "python"]'
