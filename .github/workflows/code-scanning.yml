name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@62a911d38caf0be11c07c38539530086d0cb21cc # v0.9.1
    with:
      languages: '["actions", "javascript-typescript", "python"]'
