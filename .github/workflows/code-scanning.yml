name: CodeQL

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@02fbdd0fb1873b9ba91ba7735886ff6f700da1cc # v0.5.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
