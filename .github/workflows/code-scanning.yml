name: CodeQL

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@7b39c6307d3df21b5803a2e0ec2c61f0509e0455 # v0.7.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
