name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@0512e98cff3190c9bec855e6bc753180ab3aae02 # v0.9.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
