name: CodeQL

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@68f58fa1246c18d55674caecf361ab59b4ec13ed # v0.6.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
