name: CodeQL

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@d3a0466fc6dc87898431b722e9488921d729be42 # v0.5.1
    with:
      languages: '["actions", "javascript-typescript", "python"]'
