name: CodeQL

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@2e8032c09f17a9388ad98a680d2bffa8c2cb1d8a # v0.3.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
