version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # why: Dependabot's proxy gets 401 from the presigned asset URL a GitHub
    # release download redirects to, which fails the whole uv job; these
    # packages move by their owners' release items instead.
    ignore:
      - dependency-name: "overnightworks-*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    cooldown:
      default-days: 7
