[gate]
mandatory_jobs = ["Lint and test", "End-to-end", "Coverage"]

[[root.allow]]
entry = "Makefile"
reason = "make finds its Makefile only in the directory it runs from"

[[layout.allow]]
path = "tests/game/test_production_wiring.py"
rule = "test-layout"
reason = "it proves main.py switches the game in, and main.py is a core module that must not name the game, so the proof sits with the game and goes when the game is removed"

[[gate.loosened]]
what = "import contract \"HopIn's packages depend downwards only\" changes layers"
item = "#265"
date = 2026-10-28
reason = "#265 puts the optional game layer where the agents package stood, so the game can be removed again, a tightening the gate reads as a change (overnightworks/quality#217)"

[[gate.loosened]]
what = "import contract \"Signaling's modules depend downwards only\" changes layers"
item = "#265"
date = 2026-10-28
reason = "#265 moves the game out of signaling and puts the feature port in its place, a tightening the gate reads as a change (overnightworks/quality#217)"

[[gate.loosened]]
what = "import contract \"Only agents reaches the agent service\" removed"
item = "#265"
date = 2026-10-28
reason = "#265 replaces it with the stricter call-core-knows-no-game and agent-service-only-through-the-game contracts, which forbid the same imports without the indirect allowance for the call core"
