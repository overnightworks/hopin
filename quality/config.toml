[gate]
mandatory_jobs = ["Lint and test", "End-to-end", "Coverage", "Removal drill", "Frontend", "Image"]

# End-to-end stands for the shards, which run tests/e2e/test_render_languages.py: every page once per language.
[languages]
render_pass = "End-to-end"

[[gate.loosened]]
what = 'import contract "Only the game reaches the speech service" removed'
item = "overnightworks/hopin#739"
date = 2026-11-12
reason = "renamed to say what holds, only the connector reaches the speech service; the forbidden modules are unchanged"

[[gate.loosened]]
what = 'import contract "Participation names no agent runtime" ignores hopin.participation.** -> agents.calling'
item = "overnightworks/agents#1073"
date = 2026-11-22
reason = "participation decides who may call and accept for whose agent with the library's calling standard"

[[gate.loosened]]
what = 'import contract "Participation names no agent runtime" ignores hopin.participation.** -> agents.member'
item = "overnightworks/agents#1073"
date = 2026-11-22
reason = "participation reads the member records the calling standard's tools carry"

[[root.allow]]
entry = "Makefile"
reason = "make finds its Makefile only in the directory it runs from"

[[root.allow]]
entry = "frontend/"
reason = "the SvelteKit project is a toolchain of its own: its manifest, lockfile and configuration must sit in its project directory"

[[root.allow]]
entry = "legal/"
reason = "hal reads the app's part of the legal pages from its release at exactly legal/datenschutz.html and legal/nutzungsbedingungen.html"
