[gate]
mandatory_jobs = ["Lint and test", "End-to-end", "Coverage", "Removal drill", "Frontend", "Image"]

[[root.allow]]
entry = "Makefile"
reason = "make finds its Makefile only in the directory it runs from"

[[root.allow]]
entry = "frontend/"
reason = "the SvelteKit project is a toolchain of its own: its manifest, lockfile and configuration must sit in its project directory"

[[root.allow]]
entry = "legal/"
reason = "hal reads the app's part of the legal pages from its release at exactly legal/datenschutz.html and legal/nutzungsbedingungen.html"

[[gate.loosened]]
what = 'import contract "Only the game reaches the speech service" changes forbidden_modules'
item = "overnightworks/hopin#640"
date = 2026-11-09
reason = "The speech client package is renamed (overnightworks/speech#225, ruled A on 09.11.2026); the contract forbids the new name speech_client as it forbade speech_runtime_client."

