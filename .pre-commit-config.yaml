repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        language_version: python3.14
        additional_dependencies:
          - pydantic>=2.10
          - pydantic-settings>=2.7
          - fastapi>=0.123.7
          - uvicorn
          - structlog>=24.4
        args: [--strict]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -m "not integration and not e2e" --no-header -q
        language: system
        pass_filenames: false
        always_run: true
